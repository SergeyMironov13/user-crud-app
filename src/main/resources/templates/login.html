<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #5a67d8;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 20px;
        }
        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Вход в систему</h2>
    <div th:if="${param.error}" class="error">Неверное имя пользователя или пароль</div>
    <div th:if="${param.logout}" class="info">Вы вышли из системы</div>
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Имя пользователя" required/>
        <input type="password" name="password" placeholder="Пароль" required/>
        <button type="submit">Войти</button>
    </form>
    <div class="info">
        <p>Тестовые учетные данные:</p>
        <p>user / password</p>
        <p>admin / admin123</p>
    </div>
</div>
</body>
</html>
